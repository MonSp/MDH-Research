[project]
name = "dahuang-research"
version = "0.1.0"
description = "大荒界-科研：通过智能体研究物理世界的数学解释"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "sympy>=1.12",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "httpx>=0.27",
    "openai>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.2",
    "pyyaml>=6.0",
    "pybind11>=2.11",
]
torch = [
    "torch>=2.2",
]
jupyter = [
    "jupyter>=1.0",
    "ipywidgets>=8.0",
    "matplotlib>=3.8",
]

[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
